      'https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap': { type: external, minified: true }
      css/base.css: {}
    layout:
      css/layout.css: {}
    component:
      css/components.css: {}
      css/capabilities.css: {}
      css/editorial.css: {}
  js:
    js/albaron.js: { attributes: { defer: true } }
